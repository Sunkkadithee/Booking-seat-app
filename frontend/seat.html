<!DOCTYPE html>
<html>
<head>
<title>Seat Booking</title>

<style>
body {
  font-family: Arial;
  background: #111827;
  color: white;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 100px);
  gap: 10px;
  margin-top: 20px;
}

.seat {
  padding: 20px;
  text-align: center;
  border-radius: 10px;
  cursor: pointer;
}

.available { background: green; }
.booked { background: red; }
</style>
</head>

<body>

<h2>Choose Seat</h2>
<div class="grid" id="grid"></div>

<script>
const token = localStorage.getItem("token");

fetch("http://localhost:3000/seats")
.then(r => r.json())
.then(seats => {
  const grid = document.getElementById("grid");

  seats.forEach(s => {
    const div = document.createElement("div");
    div.className = "seat " + s.status;
    div.innerText = s.zone + " " + s.seat_number;

    if (s.status === "available") {
      div.onclick = () => book(s.id);
    }

    grid.appendChild(div);
  });
});

function book(id) {
  fetch("http://localhost:3000/book", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      token,
      seat_id: id
    })
  })
  .then(r => r.json())
  .then(data => {
    alert(data.message);
    location.reload();
  });
}
</script>

</body>
</html>
