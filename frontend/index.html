<!DOCTYPE html>
<html>
<head>
<title>Library App</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: Arial;
  background: url("asset/images/bg.jpg") no-repeat center center / cover;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* 🔥 DARK OVERLAY (THIS FIXES EVERYTHING) */
body::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.65);
  z-index: 0;
}

/* HEADER */
.header {
  color: white;
  font-size: 40px;
  font-weight: bold;
  margin-bottom: 80px;
  text-align: center;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  z-index: 1;
}

/* CARD */
.container {
  width: 380px;
  background: rgba(243, 241, 241, 0.75);
  backdrop-filter: blur(15px);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(157, 88, 88, 0.3);
  color: rgb(25, 1, 1);

  position: relative;
  z-index: 1;
}

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  outline: none;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #ffffff;
  color: #333;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #764ead;
  transform: scale(1.02);
}

/* MESSAGE */
.success {
  display: none;
  background: #00c853;
  color: white;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
}

/* LINKS */
p {
  text-align: center;
  cursor: pointer;
  margin-top: 15px;
  font-size: 14px;
}
</style>
</head>

<body>

<!-- 🔥 HEADER NOW PROPERLY PLACED -->
<div class="header">
    KMUTT Reservation System
</div>

<div class="container">

<div id="msg" class="success"></div>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Login</h2>

  <input id="loginIdentifier" placeholder="Email or Student ID">
  <input id="loginPassword" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p onclick="showRegister()">Create account</p>
</div>

<!-- REGISTER -->
<div id="registerBox" style="display:none;">
  <h2>Register</h2>

  <input id="first_name" placeholder="First Name">
  <input id="last_name" placeholder="Last Name">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <input id="student_id" placeholder="Student ID">

  <button onclick="register()">Register</button>

  <p onclick="showLogin()">Back to login</p>
</div>

</div>

<script>
function showMsg(text) {
  let msg = document.getElementById("msg");
  msg.innerText = text;
  msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 2000);
}

function showRegister() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("registerBox").style.display = "block";
}

function showLogin() {
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("registerBox").style.display = "none";
}

// REGISTER
function register() {
  fetch("http://localhost:3000/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      first_name: document.getElementById("first_name").value,
      last_name: document.getElementById("last_name").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
      student_id: document.getElementById("student_id").value
    })
  })
  .then(res => res.json())
  .then(data => {
    showMsg(data.message);
    showLogin();
  });
}

// LOGIN
function login() {
  fetch("http://localhost:3000/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: document.getElementById("loginIdentifier").value,
      password: document.getElementById("loginPassword").value
    })
  })
  .then(res => res.json())
  .then(data => {

    if (!data.token) {
      showMsg(data.message);
      return;
    }

    localStorage.setItem("token", data.token);

    showMsg("Login success");

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 800);
  });
}
</script>

</body>
</html>
